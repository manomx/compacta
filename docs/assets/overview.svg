<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">From work to prepared context</title><desc id="desc">Work: finish steps. Prepare: update a background summary. Continue: reuse it on compaction when compatible.</desc><rect x=".5" y=".5" width="1199" height="259" rx="22" fill="#FAF7F4" stroke="#EAE2DB"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="60" font-size="14" font-weight="700" fill="#B4440D">01</text><text x="48" y="108" font-size="31" font-weight="650" fill="#241E1A">Work</text><text x="48" y="149" font-size="18" fill="#786E66">Your coding agent responds</text><text x="48" y="176" font-size="18" fill="#786E66">and finishes tool steps.</text><text x="438" y="60" font-size="14" font-weight="700" fill="#B4440D">02</text><text x="438" y="108" font-size="31" font-weight="650" fill="#241E1A">Prepare</text><text x="438" y="149" font-size="18" fill="#786E66">Compacta updates a summary</text><text x="438" y="176" font-size="18" fill="#786E66">in the background.</text><text x="828" y="60" font-size="14" font-weight="700" fill="#B4440D">03</text><text x="828" y="108" font-size="31" font-weight="650" fill="#241E1A">Continue</text><text x="828" y="149" font-size="18" fill="#786E66">Reuse compatible context</text><text x="828" y="176" font-size="18" fill="#786E66">when Codex compacts.</text><path d="M368 108h28m-7-7 7 7-7 7" fill="none" stroke="#C9BDB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M758 108h28m-7-7 7 7-7 7" fill="none" stroke="#C9BDB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
